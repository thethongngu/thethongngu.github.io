<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Roboto+Condensed:wght@400;500;600&display=swap"
    rel="stylesheet">
  <script>
    // Old links used hash routes such as /#/posts/slug.
    if (location.hash.startsWith('#/')) location.replace(location.hash.slice(1));
  </script>
  %sveltekit.head%
</head>

<body>
  <div id="app">%sveltekit.body%</div>
</body>

</html>
